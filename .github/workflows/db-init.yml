name: 线上数据库初始化

# 为什么放在 GitHub Actions 而不是本地执行：
# 本机到 Neon 的 5432 端口在 TLS 握手完成后会被中断（同网络下 443 端口完全正常），
# `prisma migrate deploy` 在本地必然拿不到连接。GitHub 构建机的网络出口干净，
# 且这一步本来就要求代码已经推到 GitHub。
#
# 用法：Actions → 线上数据库初始化 → Run workflow，选择要执行的内容。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 执行内容
        required: true
        default: migrate-and-seed
        type: choice
        options:
          - migrate-only # 只应用数据库迁移（建表、建索引）
          - migrate-and-seed # 追加写入演示数据（分类、账号、商品）

concurrency:
  group: db-init
  cancel-in-progress: false

jobs:
  db-init:
    name: 应用迁移与种子数据
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 种子脚本只用到密钥长度校验，不签发 Token；这里允许缺省。
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-placeholder-secret-not-used-at-runtime-0123456789' }}
      # 种子数据会往对象存储写演示图片，生产环境固定为 s3。
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --config.allow-builds=@embedded-postgres/linux-x64

      - name: 批准构建脚本
        run: pnpm approve-builds --yes

      - name: 构建共享包
        run: pnpm --filter @campus/shared build

      - name: 校验必需的环境变量
        run: |
          required=(DATABASE_URL S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_PUBLIC_BASE_URL)
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少 Actions Secrets：${missing[*]}"
            echo "请在仓库 Settings → Secrets and variables → Actions 中补齐后重新运行。"
            exit 1
          fi
          echo "环境变量检查通过，共 ${#required[@]} 项。"

      - name: 应用数据库迁移
        run: pnpm db:deploy

      - name: 写入种子数据
        if: inputs.mode == 'migrate-and-seed'
        run: pnpm db:seed

      - name: 汇总
        run: echo "执行完成：${{ inputs.mode }}"
